<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tile Trail — a calm tile-matching journey</title>
<style>
  :root{--paper:#F6F2E7;--ink:#2E2B26;--muted:#6E675B;--green:#0E6B4F;--green-deep:#0A5540;--amber:#E7A81E;--lav:#8B7FC7;--line:#DED7C4}
  body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.6 "Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;
       min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center}
  .wrap{padding:40px 24px;max-width:520px}
  .tiles{display:flex;gap:8px;justify-content:center;margin-bottom:18px}
  .tile{width:44px;height:44px;border-radius:12px;border:2px solid}
  .t1{background:#E4EFE9;border-color:var(--green)}
  .t2{background:#FBF0D6;border-color:var(--amber)}
  .t3{background:#ECE8F7;border-color:var(--lav)}
  h1{margin:.1em 0;color:var(--green-deep);font-size:2rem}
  p{color:var(--muted)}
  .links{margin-top:26px;display:flex;gap:18px;justify-content:center}
  a{color:var(--green);font-weight:600;text-decoration:none;border-bottom:1.5px solid var(--line)}
  .soon{margin-top:22px;font-size:.9rem;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="tiles" aria-hidden="true"><div class="tile t1"></div><div class="tile t2"></div><div class="tile t3"></div></div>
  <h1>Tile Trail</h1>
  <p>A calm tile-matching journey through Aotearoa's nature. No timers, always fair — and it quietly adapts to how you play.</p>
  <div class="links"><a href="privacy/">Privacy Policy</a><a href="terms/">Terms of Service</a></div>
  <p class="soon">Coming to Google Play — soft launch in New Zealand &amp; Australia.</p>
</div>
</body>
</html>
